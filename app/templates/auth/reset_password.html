{% extends "auth_base.html" %}
{% block title %}Choose a new password · StockSense{% endblock %}

{% block content %}
  <h1>Choose a new password</h1>
  <p class="lead">Enter the code we sent you, then pick a new password.</p>

  <form method="post">
    <div class="field">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" value="{{ email }}" required>
    </div>

    <div class="field">
      <label for="otp">Reset code</label>
      <input id="otp" name="otp" type="text" value="{{ otp }}"
             inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
             placeholder="000000" required>
    </div>

    <div class="field">
      <label for="password">New password</label>
      <input id="password" name="password" type="password"
             autocomplete="new-password" minlength="8" required>
      <span class="help">At least 8 characters.</span>
    </div>

    <div class="field">
      <label for="confirm">Confirm new password</label>
      <input id="confirm" name="confirm" type="password"
             autocomplete="new-password" minlength="8" required>
    </div>

    <button class="btn btn-primary" type="submit">Reset password</button>
  </form>

  <div class="auth-links">
    <a href="{{ url_for('auth.forgot_password') }}">Request a new code</a>
    <a href="{{ url_for('auth.login') }}">Back to sign in</a>
  </div>
{% endblock %}
