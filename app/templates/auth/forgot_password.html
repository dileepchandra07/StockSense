{% extends "auth_base.html" %}
{% block title %}Reset password · StockSense{% endblock %}

{% block content %}
  <h1>Reset your password</h1>
  <p class="lead">We will send a six-digit code to your email address.</p>

  <form method="post">
    <div class="field">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required autofocus>
    </div>
    <button class="btn btn-primary" type="submit">Send reset code</button>
  </form>

  <div class="auth-links">
    <a href="{{ url_for('auth.login') }}">Back to sign in</a>
    <a href="{{ url_for('auth.reset_password') }}">I already have a code</a>
  </div>
{% endblock %}
