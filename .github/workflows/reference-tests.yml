name: reference tests

# The reference implementation encodes the domain invariants. If these break,
# the semantics are broken -- regardless of what the application stack is doing.
# See docs/domain-model.md for the invariants themselves.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: invariant tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: reference

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the invariant test suite
        run: python -m unittest -v

      - name: Run the demo walkthrough
        run: python demo.py
